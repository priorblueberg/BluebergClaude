project_id = "ofuxkbzzibykelucsscv"
# Encadeada pelo pg_net (invest.disparar_funcao), que chama sem cabecalho de autorizacao.
# Um deploy sem esta linha religa o JWT e a carga para na primeira etapa, sem erro visivel.
[functions.carga-cotas-fundo]
verify_jwt = false

# Chamada pelo pg_cron via pg_net, sem cabecalho de autorizacao.
[functions.daily-fund-quotes-sync]
verify_jwt = false

# Auditorias semanais, chamadas pelo pg_cron via pg_net, sem cabecalho de autorizacao.
# Faltavam aqui: em 20/09/2026 um deploy pela CLI religou o JWT da auditoria-proventos e o cron
# passou a receber 401. Estavam com `verify_jwt = false` so no servidor, e o arquivo nao sabia.
[functions.auditoria-proventos]
verify_jwt = false

[functions.auditoria-eventos]
verify_jwt = false

# Carga mensal dos emissores da CVM (companhias abertas e securitizadoras), chamada pelo pg_cron
# via pg_net, sem cabecalho de autorizacao.
[functions.sync-emissores-cvm]
verify_jwt = false

# A ponte para o banco de financas pessoais NAO pode ser publica: ela le dado pessoal com uma
# chave que o navegador nao tem. `verify_jwt = true` e o padrao, e esta escrito aqui para que um
# deploy futuro nao o desligue sem querer - foi o que aconteceu com as auditorias em 20/09/2026,
# ao contrario: elas precisavam de `false` e voltaram com `true`.
[functions.patrimonio-pessoal]
verify_jwt = true
